services:
  home-scatolo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-scatolo
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - PORT=3000
      - DB_PATH=/data/inventory.db
      - PUBLIC_WEB_DIR=/app/public
    ports:
      # Esposto solo su localhost del MiniPC: cloudflared inoltra verso http://127.0.0.1:3000
      # Cambia in "3000:3000" se vuoi raggiungerlo direttamente anche da altri dispositivi in LAN
      - "127.0.0.1:3000:3000"
    volumes:
      # Database SQLite persistente (backup: ./scripts/deploy-local.sh installa cron con VACUUM INTO)
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Se Ollama, cloudflared o Hermes Agent sono su una rete Docker condivisa, scommenta:
    # networks:
    #   - default
    #   - homelab_net

# networks:
#   homelab_net:
#     external: true
