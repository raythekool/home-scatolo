name: Flutter CI

on:
  push:
    branches: [main]
    paths: ["app/**"]
  pull_request:
    paths: ["app/**"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
