name: Deploy Backend (Azure)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Accedi ad Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Costruisci e pubblica l'immagine
        run: |
          az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"
          docker build --tag "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/home-scatolo-api:${{ github.sha }}" .
          docker push "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/home-scatolo-api:${{ github.sha }}"
      - name: Crea o aggiorna Container App
        working-directory: .
        run: |
          image="${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/home-scatolo-api:${{ github.sha }}"
          if az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "$image" \
              --set-env-vars \
                "ALLOWED_ORIGINS=https://raythekool.github.io" \
                "AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}" \
                "AZURE_OPENAI_DEPLOYMENT=${{ vars.AZURE_OPENAI_DEPLOYMENT }}"
          else
            az containerapp create \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}" \
              --image "$image" \
              --registry-server "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io" \
              --registry-identity "${{ vars.AZURE_CONTAINER_APP_IDENTITY_ID }}" \
              --user-assigned "${{ vars.AZURE_CONTAINER_APP_IDENTITY_ID }}" \
              --target-port 3000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --env-vars \
                "ALLOWED_ORIGINS=https://raythekool.github.io" \
                "AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}" \
                "AZURE_OPENAI_DEPLOYMENT=${{ vars.AZURE_OPENAI_DEPLOYMENT }}"
          fi
      - name: Verifica endpoint salute
        working-directory: .
        run: |
          fqdn=$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --retry 12 --retry-delay 5 "https://${fqdn}/health"
