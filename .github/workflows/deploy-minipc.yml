name: Deploy MiniPC Image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "Dockerfile.minipc"
      - "docker-compose.minipc.yml"
      - ".github/workflows/deploy-minipc.yml"
  workflow_dispatch:

concurrency:
  group: deploy-minipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build PWA for MiniPC (same-origin remote mode)
        run: |
          flutter build web --release \
            --base-href / \
            --dart-define=STORAGE_MODE=remote \
            --dart-define=API_BASE_URL=
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-web-bundle
          path: app/build/web
          retention-days: 1

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish-minipc-image:
    needs: [test-and-build-pwa, test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pwa-web-bundle
          path: app/build/web
      - name: Compute lowercase GHCR image name
        id: meta
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-12)
          echo "image=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "image_tag=ghcr.io/${repo_lower}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.minipc
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-minipc-ssh-deploy:
    needs: [publish-minipc-image]
    if: ${{ vars.MINIPC_DEPLOY_MODE == 'ssh' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy immediately to MiniPC over SSH
        env:
          SSH_HOST: ${{ secrets.MINIPC_SSH_HOST }}
          SSH_USER: ${{ secrets.MINIPC_SSH_USER }}
          SSH_PORT: ${{ secrets.MINIPC_SSH_PORT }}
          SSH_KEY: ${{ secrets.MINIPC_SSH_KEY }}
          APP_DIR: ${{ vars.MINIPC_APP_DIR }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          port="${SSH_PORT:-22}"
          app_dir="${APP_DIR:-/opt/home-scatolo}"
          ssh-keyscan -p "$port" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -p "$port" "${SSH_USER}@${SSH_HOST}" bash -s "$app_dir" <<'REMOTE'
            set -euo pipefail
            cd "$1"
            docker compose -f docker-compose.minipc.yml pull home-scatolo
            docker compose -f docker-compose.minipc.yml up -d --remove-orphans home-scatolo
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/livez >/dev/null; then
                echo "Home Scatolo livez OK"
                exit 0
              fi
              sleep 2
            done
            echo "Home Scatolo failed health verification" >&2
            exit 1
          REMOTE
