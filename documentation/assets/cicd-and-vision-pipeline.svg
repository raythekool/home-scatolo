<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="Pipeline CI/CD MiniPC e Vision AI Fallback Home Scatolo">
  <defs>
    <style>
      .bg { fill: #F4F2EC; }
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #123447; }
      .sub { font: 500 13px system-ui, -apple-system, sans-serif; fill: #3C5868; }
      .box { fill: #FFFFFF; stroke: #D2DAD6; stroke-width: 1.5; rx: 14; }
      .step { fill: #FAF9F5; stroke: #123447; stroke-width: 1.6; rx: 10; }
      .step-accent { fill: #123447; stroke: #123447; stroke-width: 1.6; rx: 10; }
      .step-orange { fill: #FDEBE5; stroke: #C84B28; stroke-width: 1.8; rx: 10; }
      .step-ok { fill: #E7F6EE; stroke: #146C43; stroke-width: 1.6; rx: 10; }
      .step-warn { fill: #FFF4DF; stroke: #9A5B00; stroke-width: 1.6; rx: 10; }
      .h { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #123447; }
      .hw { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #FFFFFF; }
      .p { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #3C5868; }
      .pw { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #D5E4EC; }
      .arr { stroke: #123447; stroke-width: 2; fill: none; marker-end: url(#a1); }
      .arr-o { stroke: #C84B28; stroke-width: 2; fill: none; marker-end: url(#a2); }
      .arr-d { stroke: #9A5B00; stroke-width: 2; stroke-dasharray: 5 4; fill: none; marker-end: url(#a3); }
    </style>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#123447"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#C84B28"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#9A5B00"/></marker>
  </defs>

  <rect class="bg" width="1120" height="470" rx="16"/>
  <text x="34" y="38" class="title">Pipeline CI/CD Zero-Touch &amp; Flusso Riconoscimento Vision AI</text>
  <text x="34" y="60" class="sub">Dal git push su main all'aggiornamento automatico sul MiniPC + resilienza AI cloud → Ollama</text>

  <!-- Row 1: CI/CD -->
  <rect class="box" x="34" y="80" width="1052" height="164"/>
  <text x="54" y="106" class="h">1. Pipeline di Deploy Automatico (GitHub Actions → GHCR → MiniPC)</text>

  <rect class="step" x="54" y="124" width="160" height="98"/>
  <text x="68" y="148" class="h">git push main</text>
  <text x="68" y="168" class="p">app/** o backend/**</text>
  <text x="68" y="186" class="p">Trigger automatico</text>
  <text x="68" y="204" class="p">deploy-minipc.yml</text>

  <rect class="step" x="246" y="124" width="196" height="98"/>
  <text x="260" y="148" class="h">Test &amp; Build Paralleli</text>
  <text x="260" y="168" class="p">Flutter analyze + test</text>
  <text x="260" y="186" class="p">Build PWA (remote mode)</text>
  <text x="260" y="204" class="p">Backend tsc + 23 test</text>

  <rect class="step-accent" x="474" y="124" width="196" height="98"/>
  <text x="488" y="148" class="hw">Docker All-in-One</text>
  <text x="488" y="168" class="pw">Dockerfile.minipc</text>
  <text x="488" y="186" class="pw">Node 22 + PWA /public</text>
  <text x="488" y="204" class="pw">linux/amd64 (N97)</text>

  <rect class="step-orange" x="702" y="124" width="166" height="98"/>
  <text x="716" y="148" class="h">GHCR Registry</text>
  <text x="716" y="168" class="p">ghcr.io/raythekool/</text>
  <text x="716" y="186" class="p">home-scatolo:latest</text>
  <text x="716" y="204" class="p">+ :sha-&lt;commit&gt;</text>

  <rect class="step-ok" x="900" y="124" width="166" height="98"/>
  <text x="914" y="148" class="h">MiniPC Vaiano</text>
  <text x="914" y="168" class="p">Watchtower (ogni 5m)</text>
  <text x="914" y="186" class="p">oppure SSH istantaneo</text>
  <text x="914" y="204" class="p">Healthcheck /livez</text>

  <path class="arr" d="M214 173 L242 173"/>
  <path class="arr" d="M442 173 L470 173"/>
  <path class="arr-o" d="M670 173 L698 173"/>
  <path class="arr" d="M868 173 L896 173"/>

  <!-- Row 2: Vision AI Fallback -->
  <rect class="box" x="34" y="264" width="1052" height="178"/>
  <text x="54" y="290" class="h">2. Pipeline Riconoscimento Vision AI con Fallback Automatico (POST /recognize)</text>

  <rect class="step" x="54" y="310" width="184" height="110"/>
  <text x="68" y="334" class="h">Foto + Contesto</text>
  <text x="68" y="354" class="p">JPEG/PNG/WebP ≤ 5 MB</text>
  <text x="68" y="372" class="p">+ existingItems del box</text>
  <text x="68" y="390" class="p">Validazione schema</text>
  <text x="68" y="408" class="p">(mai loggata in chiaro)</text>

  <rect class="step-orange" x="278" y="310" width="222" height="110"/>
  <text x="294" y="334" class="h">1° Tentativo: Cloud</text>
  <text x="294" y="354" class="p">GitHub Models (GPT-4o)</text>
  <text x="294" y="372" class="p">o Anthropic (Claude)</text>
  <text x="294" y="390" class="p">Timeout default: 30s</text>
  <text x="294" y="408" class="p">X-Vision-Fallback: false</text>

  <rect class="step-warn" x="540" y="310" width="222" height="110"/>
  <text x="556" y="334" class="h">2° Tentativo: Ollama</text>
  <text x="556" y="354" class="p">Attivato se errore/429/JSON</text>
  <text x="556" y="372" class="p">qwen2.5vl:3b / gemma3:4b</text>
  <text x="556" y="390" class="p">Timeout CPU N97: 90s</text>
  <text x="556" y="408" class="p">X-Vision-Fallback: true</text>

  <rect class="step-ok" x="802" y="310" width="264" height="110"/>
  <text x="818" y="334" class="h">Revisione &amp; Deduplica</text>
  <text x="818" y="354" class="p">DuplicateMatcher sul client:</text>
  <text x="818" y="372" class="p">Aggiungi • Incrementa • Ignora</text>
  <text x="818" y="390" class="p">Salvataggio su SQLite + FTS5</text>
  <text x="818" y="408" class="p">Metriche registrate in scan_logs</text>

  <path class="arr" d="M238 365 L274 365"/>
  <path class="arr-d" d="M500 365 L536 365"/>
  <path class="arr" d="M762 365 L798 365"/>
</svg>
