$kind: http-request
name: 'Export Full Inventory JSON'
method: GET
url: '{{baseUrl}}/api/export'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('exports version 1 inventory snapshot', () => {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.version).to.eql(1);
        pm.expect(body.houses).to.be.an('array');
        pm.expect(body.items).to.be.an('array');
      });
